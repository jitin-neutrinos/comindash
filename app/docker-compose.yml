services:
  db:
    image: pgvector/pgvector:pg16
    networks:
      app_default:
        ipv4_address: 172.22.0.5
    environment:
      POSTGRES_USER: insights
      POSTGRES_PASSWORD: ${DB_PASSWORD:-insights_local}
      POSTGRES_DB: insights
    command:
      # Production sizing for a shared 64GB host: bounded shared_buffers and
      # connections keep Postgres a good citizen next to the GPU sidecar and
      # desktop session, instead of default-config memory growth.
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "max_connections=60"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "autovacuum_max_workers=2"
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insights -d insights"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3g

  backend:
    build: ./backend
    networks:
      app_default:
        ipv4_address: 172.22.0.3
        aliases:
          - backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://insights:${DB_PASSWORD:-insights_local}@db:5432/insights
      SCHEDULER_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/api/health').read()\""]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # Production resource bounds (OOM guard): the backend is a thin API over
    # Postgres; 512M is ~3x its observed working set. Hard limit = OOM-kill
    # the container (restart policy revives it) instead of the host OOM
    # killer taking down Postgres or the desktop session.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"

  worker:
    build: ./worker
    networks:
      app_default:
        ipv4_address: 172.22.0.4
        aliases:
          - worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://insights:${DB_PASSWORD:-insights_local}@db:5432/insights
      SIDECAR_CONNECT_RETRIES: "6"
      SIDECAR_RETRY_DELAY_S: "10"
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Production resource bounds: worker executes ingest/analysis batches in
    # memory (bounded by analysis_batch_size=500 posts); 768M covers that
    # with headroom while capping a runaway batch before it hits the host.
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "2.0"

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8082:80"
    networks:
      app_default:
        ipv4_address: 172.22.0.6
    depends_on:
      - backend
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  promtail:
    image: grafana/promtail:2.9.4
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  prometheus:
    image: prom/prometheus:v2.45.3
    networks:
      - app_default
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped

volumes:
  db_data:
  prometheus_data:

networks:
  app_default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
  bridge:
    external: true

# Fixed per-service IPs so a daemon restart can never renumber db out from
# under a running backend/worker (2026-09-23: reboot moved db .5→.2, backend's
# cached addr failed with "Connect call failed ('172.22.0.5', 5432)").
x-static-ips:
  db: 172.22.0.5
  backend: &backend_ip 172.22.0.3
  worker: 172.22.0.4
