[alembic]
script_location = alembic
prepend_sys_path = .
# URL is resolved from DATABASE_URL env (app.config) in env.py; this is a fallback.
sqlalchemy.url = postgresql+asyncpg://insights:insights_local@localhost:5433/insights

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
