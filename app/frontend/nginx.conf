server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Backend API (compose service name "backend", internal port 8000).
    # 127.0.0.11 is Docker's embedded DNS. A plain proxy_pass to a bare
    # hostname resolves once at startup and caches it for the nginx
    # process's lifetime, so recreating the backend container (a new
    # internal IP each time) leaves this proxy silently talking to a dead
    # or reassigned address until nginx itself is restarted. Putting the
    # host in a variable forces re-resolution on every request.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for react-router routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ttf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
