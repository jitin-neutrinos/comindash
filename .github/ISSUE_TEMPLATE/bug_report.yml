name: Bug report
description: Something is broken or behaves unexpectedly
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the actual behavior and any error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: service
    attributes:
      label: Affected service
      options:
        - backend
        - worker
        - frontend
        - db
        - observability (loki/promtail/prometheus)
        - other / unknown
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Runtime mode
      options:
        - Stub mode (no AI Hub tokens)
        - Real AI Hub tokens
        - Local (outside compose)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Loki query result or container output.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who or what is affected, and since when.
